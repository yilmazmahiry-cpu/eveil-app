<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistance — Éveil</title>
<style>
  :root {
    --bg: #12142B;
    --bg-outer: #0b0c1c;
    --gold: #CBA35C;
    --ink: #F5F1E6;
    --ink-muted: #9295B5;
    --border: rgba(203,163,92,0.22);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-outer);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 40px 20px 80px;
    line-height: 1.65;
  }
  .page { max-width: 560px; margin: 0 auto; }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .logo { width: 28px; height: 28px; }
  .logo-word { font-size: 15px; color: var(--ink-muted); }
  h1 { font-size: 26px; margin: 0 0 16px; }
  p { font-size: 15px; color: var(--ink); }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-top: 24px;
  }
  a { color: var(--gold); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .label { font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="page">
  <div class="logo-row">
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="8.3" stroke="#CBA35C" stroke-width="1.4"/>
      <circle cx="15.3" cy="8.7" r="1.6" fill="#CBA35C"/>
    </svg>
    <span class="logo-word">Éveil</span>
  </div>

  <h1>Besoin d'aide ?</h1>
  <p>Une question sur l'app, ton compte ou ton abonnement ? Écris-nous, on répond directement.</p>

  <div class="card">
    <div class="label">Email</div>
    <a href="mailto:yilmazmahir.y@gmail.com">yilmazmahir.y@gmail.com</a>
  </div>

  <div class="card">
    <div class="label">Politique de confidentialité</div>
    <a href="./privacy.html">Consulter la politique de confidentialité</a>
  </div>
</div>
</body>
</html>
